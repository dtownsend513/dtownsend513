<section>
  <h2>Contact Us</h2>
  <div class="container contact-grid">
    <form name="contact" method="POST" data-netlify="true" class="contact-form">
      <input type="hidden" name="form-name" value="contact">
      <label>Name<input type="text" name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Phone<input type="tel" name="phone"></label>
      <label>Project Details<textarea name="message"></textarea></label>
      <label><input type="checkbox" name="newsletter"> Subscribe to newsletter</label>
      <button class="btn btn-primary" type="submit">Send Message</button>
    </form>
    <div class="calendly-widget">
      <div class="calendly-inline-widget"
           data-url="https://calendly.com/damien-townsend/30min"
           style="min-width:320px;height:400px;">
      </div>
      <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
    </div>
  </div>
</section>
